<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="stylesheet" href="Loginstyle.css" />
</head>
<body>
  <div class="auth-box">
    <h1 id="auth-title">Welcome Back</h1>
    <p class="subtitle" id="auth-subtitle">Login to play</p>

    <hr class="divider" />

    <div class="input-group">
      <label>Username</label>
      <input type="text" id="auth-username" placeholder="Enter your username" />
    </div>

    <div class="input-group" id="email-group" style="display:none">
      <label>Email</label>
      <input type="email" id="auth-email" placeholder="Enter your email" />
    </div>

    <div class="input-group">
      <label>Password</label>
      <input type="password" id="auth-password" placeholder="Enter your password" />
    </div>

    <button class="auth-btn" id="auth-btn">Login</button>

    <p class="auth-error"   id="auth-error"></p>
    <p class="auth-success" id="auth-success"></p>

    <p class="auth-toggle">
      <span id="auth-switch">Don't have an account? Register</span>
    </p>
  </div>
  <script src="login.js"></script>
</body>
</html>
